<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        SPORTHUB | Chuyển đến website chính
    </title>

    <meta
        name="description"
        content="SPORTHUB Fitness và Personal Plan đã được tích hợp vào website SPORTHUB chính."
    >

    <!--
        Repo V2 hiện chỉ được dùng để lưu tài nguyên
        như video hướng dẫn bài tập.

        Không cho Google index trang root V2
        để tránh trùng website với V1.
    -->
    <meta
        name="robots"
        content="noindex, follow"
    >

    <!-- Website SPORTHUB chính -->
    <link
        rel="canonical"
        href="https://tranthiquynhnhu0901-hue.github.io/shopthethao/"
    >

    <!--
        Fallback redirect nếu JavaScript bị tắt.
    -->
    <meta
        http-equiv="refresh"
        content="0; url=https://tranthiquynhnhu0901-hue.github.io/shopthethao/"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 24px;

            background: #061016;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .redirect-card {
            width: min(
                620px,
                100%
            );

            padding: 34px;

            border: 1px solid
                rgba(
                    255,
                    255,
                    255,
                    .12
                );

            border-radius: 18px;

            background: #0d1b22;

            text-align: center;

            box-shadow:
                0 24px 70px
                rgba(
                    0,
                    0,
                    0,
                    .28
                );
        }

        .logo {
            margin-bottom: 20px;

            font-size: 34px;
            line-height: 1;

            font-weight: 900;
            letter-spacing: -.04em;
        }

        .logo span {
            color: #c8ff00;
        }

        h1 {
            margin: 0 0 12px;

            font-size:
                clamp(
                    26px,
                    5vw,
                    40px
                );

            line-height: 1.15;
        }

        p {
            margin: 0;

            color: #c7d0d5;

            font-size: 15px;
            line-height: 1.75;
        }

        a {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            margin-top: 24px;

            min-height: 48px;

            padding:
                12px
                20px;

            border-radius: 10px;

            background: #c8ff00;
            color: #061016;

            font-weight: 900;
            text-decoration: none;
        }

        a:hover {
            background: #d8ff4a;
        }
    </style>

    <script>
        (() => {

            "use strict";

            const MAIN_SITE =
                "https://tranthiquynhnhu0901-hue.github.io/shopthethao/";


            /*
                replace() giúp URL V2 không nằm lại
                trong lịch sử Back của trình duyệt.
            */
            window.location.replace(
                MAIN_SITE
            );

        })();
    </script>
</head>


<body>

    <main class="redirect-card">

        <div
            class="logo"
            aria-label="SPORTHUB"
        >
            SPORT<span>HUB</span>
        </div>

        <h1>
            Đang chuyển đến SPORTHUB
        </h1>

        <p>
            Fitness Check và Kế hoạch cá nhân
            hiện được sử dụng trên website
            SPORTHUB chính.
        </p>

        <p>
            Nếu trình duyệt không tự chuyển trang,
            hãy sử dụng nút bên dưới.
        </p>

        <a
            href="https://tranthiquynhnhu0901-hue.github.io/shopthethao/"
        >
            MỞ SPORTHUB
        </a>

    </main>

</body>

</html>
